<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>投稿する - 動物園ウォーズ攻略Wiki</title>
  <link rel="stylesheet" href="assets/style.css?v=20260914-2">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="site-title" href="index.html">
        動物園ウォーズ攻略Wiki
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar"></aside>

    <main class="content">
      <nav class="crumb">
        <a href="index.html">トップ</a> &gt; 投稿する
      </nav>

      <h1>投稿する</h1>

      <div class="box info">
        投稿は管理者の確認後に公開されます。
        ファンアートも歓迎しています。
      </div>

      <form id="communityForm" class="community-form">
        <label>
          投稿者名
          <input
            name="author_name"
            type="text"
            maxlength="40"
            placeholder="匿名でもOK"
          >
        </label>

        <label>
          種類
          <select name="category" required>
            <option value="攻略">攻略</option>
            <option value="小ネタ">小ネタ</option>
            <option value="デッキ">デッキ</option>
            <option value="ファンアート">ファンアート</option>
            <option value="その他">その他</option>
          </select>
        </label>

        <label>
          タイトル
          <input
            name="title"
            type="text"
            maxlength="80"
            required
          >
        </label>

        <label>
          本文
          <textarea
            name="body"
            rows="8"
            maxlength="2000"
            required
          ></textarea>
        </label>

        <label>
          画像（任意）
          <input
            name="image"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif"
          >
        </label>

        <label class="community-check">
          <input
            name="rights_confirmed"
            type="checkbox"
            required
          >
          <span>
            投稿する文章・画像は、自分で制作したもの、
            または掲載許可を得たものです。
          </span>
        </label>

        <button class="answer-button" type="submit">
          確認待ちとして投稿する
        </button>

        <div id="submitMessage" class="community-submit-message"></div>
      </form>
    </main>
  </div>

  <footer class="footer">
    動物園ウォーズ攻略Wiki（非公式・ファン制作）
  </footer>

  <script src="assets/common-menu.js?v=20260914-2"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/submit.js?v=20260914-2"></script>
</body>
</html>
