<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>投稿する - 動物園ウォーズ攻略Wiki</title>
  <link rel="stylesheet" href="assets/style.css?v=20260914-3">
  <link rel="stylesheet" href="assets/community.css?v=20260914-3">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="site-title" href="index.html">
        動物園ウォーズ攻略Wiki
      </a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar"></aside>

    <main class="content">
      <nav class="crumb">
        <a href="index.html">トップ</a> &gt; 投稿する
      </nav>

      <h1>投稿する</h1>

      <div class="box info">
        投稿はメールで受け付けています。
        内容を確認し、掲載OKのものだけWikiに公開します。
        ファンアートも歓迎です。
      </div>

      <form id="communityForm" class="community-form">
        <label>
          投稿者名
          <input
            name="author_name"
            type="text"
            maxlength="40"
            placeholder="匿名でもOK"
          >
        </label>

        <label>
          種類
          <select name="category" required>
            <option value="攻略">攻略</option>
            <option value="小ネタ">小ネタ</option>
            <option value="デッキ">デッキ</option>
            <option value="ファンアート">ファンアート</option>
            <option value="その他">その他</option>
          </select>
        </label>

        <label>
          タイトル
          <input
            name="title"
            type="text"
            maxlength="80"
            required
          >
        </label>

        <label>
          本文
          <textarea
            name="body"
            rows="8"
            maxlength="2000"
            required
          ></textarea>
        </label>

        <div class="box warn">
          <strong>画像を投稿する場合</strong><br>
          メール作成画面が開いたあと、画像を添付してください。
          ブラウザから画像を自動添付することはできません。
        </div>

        <label class="community-check">
          <input
            name="rights_confirmed"
            type="checkbox"
            required
          >
          <span>
            投稿する文章・画像は、自分で制作したもの、
            または掲載許可を得たものです。
          </span>
        </label>

        <div class="community-actions">
          <button
            id="mailButton"
            class="answer-button"
            type="button"
          >
            メールを作成
          </button>

          <button
            id="gmailButton"
            class="answer-button"
            type="button"
          >
            Gmailで作成
          </button>
        </div>

        <p class="small">
          宛先：dbwdbw@gmail.com
        </p>

        <div id="submitMessage" class="community-submit-message"></div>
      </form>
    </main>
  </div>

  <footer class="footer">
    動物園ウォーズ攻略Wiki（非公式・ファン制作）
  </footer>

  <script src="assets/common-menu.js?v=20260914-3"></script>
  <script src="assets/submit.js?v=20260914-3"></script>
</body>
</html>
