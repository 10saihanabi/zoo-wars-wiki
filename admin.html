<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>投稿管理 - 動物園ウォーズ攻略Wiki</title>
  <link rel="stylesheet" href="assets/style.css?v=20260914-2">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="site-title" href="index.html">
        動物園ウォーズ攻略Wiki
      </a>
    </div>
  </header>

  <div class="layout admin-layout">
    <aside class="sidebar"></aside>

    <main class="content">
      <h1>投稿管理</h1>

      <section id="adminLogin" class="box">
        <h2>管理者ログイン</h2>
        <form id="adminLoginForm" class="community-form compact">
          <label>
            メールアドレス
            <input name="email" type="email" required>
          </label>
          <label>
            パスワード
            <input name="password" type="password" required>
          </label>
          <button class="answer-button" type="submit">
            ログイン
          </button>
        </form>
        <div id="adminLoginMessage" class="community-submit-message"></div>
      </section>

      <section id="adminPanel" hidden>
        <div class="admin-toolbar">
          <p>
            未承認投稿を確認し、公開可否を判断します。
          </p>
          <button id="adminLogout" class="answer-button" type="button">
            ログアウト
          </button>
        </div>

        <div id="adminPosts" class="community-list">
          <p class="small">投稿を読み込んでいます…</p>
        </div>
      </section>
    </main>
  </div>

  <footer class="footer">
    動物園ウォーズ攻略Wiki 管理用
  </footer>

  <script src="assets/common-menu.js?v=20260914-2"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/admin.js?v=20260914-2"></script>
</body>
</html>
